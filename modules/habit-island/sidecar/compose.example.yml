# Beispiel: Sidecar neben myCrib. Auf euer Setup anpassen (Netzwerk, Hostname, Proxy).
services:
  habit-island:
    build: ./sidecar            # relativ zum Modulordner; Pfad ggf. anpassen
    restart: unless-stopped
    environment:
      MYCRIB_URL: http://mycrib:3000        # interne myCrib-Adresse (Servicename)
      PUBLIC_ORIGIN: https://home.example.org  # exakt der Ursprung, unter dem ihr myCrib oeffnet
    volumes:
      - habit_island_data:/data
    labels:                      # Traefik: nur diesen Pfad zum Sidecar leiten, alles andere bleibt bei myCrib
      - traefik.enable=true
      - traefik.http.routers.habit-island.rule=Host(`home.example.org`) && PathPrefix(`/api/extensions/habit-island`)
      - traefik.http.routers.habit-island.priority=100
      - traefik.http.services.habit-island.loadbalancer.server.port=3100
volumes:
  habit_island_data:
